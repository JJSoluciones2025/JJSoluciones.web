<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="Limpieza y mantenimiento de una computadora: aire comprimido, pincel y pasta térmica">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15121f"/><stop offset="1" stop-color="#070709"/></linearGradient>
  <linearGradient id="marca" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#667eea"/><stop offset="1" stop-color="#764ba2"/></linearGradient>
  <radialGradient id="halo" cx="0.8" cy="0.2" r="0.7"><stop offset="0" stop-color="#b794f4" stop-opacity="0.35"/><stop offset="1" stop-color="#b794f4" stop-opacity="0"/></radialGradient>
</defs>
<rect width="800" height="500" fill="url(#bg)"/>
<rect width="800" height="500" fill="url(#halo)"/>
<!-- gabinete abierto -->
<rect x="70" y="70" width="380" height="360" rx="16" fill="#111118" stroke="#2a2a34"/>
<rect x="88" y="88" width="344" height="324" rx="10" fill="#0d0d12" stroke="#1c1c24"/>
<!-- motherboard -->
<rect x="112" y="120" width="230" height="262" rx="6" fill="#16162a" stroke="#3b3466"/>
<rect x="270" y="140" width="8" height="120" rx="2" fill="#2a2a34"/><rect x="284" y="140" width="8" height="120" rx="2" fill="#2a2a34"/><rect x="298" y="140" width="8" height="120" rx="2" fill="#2a2a34"/><rect x="312" y="140" width="8" height="120" rx="2" fill="#2a2a34"/>
<rect x="130" y="290" width="150" height="20" rx="3" fill="#2a2a34"/><rect x="130" y="322" width="150" height="20" rx="3" fill="#2a2a34"/>
<rect x="140" y="352" width="10" height="14" rx="2" fill="#1c1c24"/><rect x="162" y="352" width="10" height="14" rx="2" fill="#1c1c24"/><rect x="184" y="352" width="10" height="14" rx="2" fill="#1c1c24"/><rect x="206" y="352" width="10" height="14" rx="2" fill="#1c1c24"/><rect x="228" y="352" width="10" height="14" rx="2" fill="#1c1c24"/><rect x="250" y="352" width="10" height="14" rx="2" fill="#1c1c24"/>
<!-- cooler del procesador -->
<circle cx="196" cy="200" r="52" fill="#1c1c24" stroke="#2a2a34" stroke-width="3"/>
<g stroke="#3b3466" stroke-width="10" stroke-linecap="round">
  <line x1="196" y1="160" x2="196" y2="240"/><line x1="156" y1="200" x2="236" y2="200"/>
  <line x1="168" y1="172" x2="224" y2="228"/><line x1="224" y1="172" x2="168" y2="228"/>
  <animateTransform attributeName="transform" type="rotate" from="0 196 200" to="360 196 200" dur="2.4s" repeatCount="indefinite"/>
</g>
<circle cx="196" cy="200" r="14" fill="#b794f4"/>
<!-- ventilador del gabinete -->
<circle cx="392" cy="150" r="30" fill="#1c1c24" stroke="#2a2a34" stroke-width="3"/>
<g stroke="#3b3466" stroke-width="6" stroke-linecap="round">
  <line x1="392" y1="126" x2="392" y2="174"/><line x1="368" y1="150" x2="416" y2="150"/>
  <animateTransform attributeName="transform" type="rotate" from="0 392 150" to="360 392 150" dur="1.6s" repeatCount="indefinite"/>
</g>
<circle cx="392" cy="150" r="7" fill="#b794f4"/>
<!-- polvo saliendo -->
<circle cx="292" cy="150" r="5" fill="#9ca3af" opacity="0.55">
    <animate attributeName="cx" from="292" to="352" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.6" to="0" dur="1.6s" repeatCount="indefinite"/>
  </circle><circle cx="318" cy="128" r="4" fill="#9ca3af" opacity="0.55">
    <animate attributeName="cx" from="318" to="398" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.6" to="0" dur="2s" repeatCount="indefinite"/>
  </circle><circle cx="346" cy="158" r="6" fill="#9ca3af" opacity="0.55">
    <animate attributeName="cx" from="346" to="446" dur="2.4000000000000004s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.6" to="0" dur="2.4000000000000004s" repeatCount="indefinite"/>
  </circle><circle cx="372" cy="132" r="3" fill="#9ca3af" opacity="0.55">
    <animate attributeName="cx" from="372" to="432" dur="2.8000000000000003s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.6" to="0" dur="2.8000000000000003s" repeatCount="indefinite"/>
  </circle><circle cx="304" cy="184" r="4" fill="#9ca3af" opacity="0.55">
    <animate attributeName="cx" from="304" to="384" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.6" to="0" dur="1.6s" repeatCount="indefinite"/>
  </circle><circle cx="338" cy="196" r="5" fill="#9ca3af" opacity="0.55">
    <animate attributeName="cx" from="338" to="438" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.6" to="0" dur="2s" repeatCount="indefinite"/>
  </circle><circle cx="366" cy="176" r="3" fill="#9ca3af" opacity="0.55">
    <animate attributeName="cx" from="366" to="426" dur="2.4000000000000004s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.6" to="0" dur="2.4000000000000004s" repeatCount="indefinite"/>
  </circle><circle cx="396" cy="150" r="4" fill="#9ca3af" opacity="0.55">
    <animate attributeName="cx" from="396" to="476" dur="2.8000000000000003s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.6" to="0" dur="2.8000000000000003s" repeatCount="indefinite"/>
  </circle><circle cx="408" cy="186" r="5" fill="#9ca3af" opacity="0.55">
    <animate attributeName="cx" from="408" to="508" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.6" to="0" dur="1.6s" repeatCount="indefinite"/>
  </circle><circle cx="330" cy="226" r="4" fill="#9ca3af" opacity="0.55">
    <animate attributeName="cx" from="330" to="390" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.6" to="0" dur="2s" repeatCount="indefinite"/>
  </circle>
<!-- aire comprimido -->
<g transform="translate(582 326) rotate(-60)">
  <rect x="0" y="0" width="60" height="150" rx="12" fill="url(#marca)"/>
  <rect x="14" y="-24" width="32" height="26" rx="6" fill="#e5e5e5"/>
  <rect x="24" y="-44" width="12" height="22" rx="3" fill="#9ca3af"/>
  <rect x="8" y="30" width="44" height="80" rx="6" fill="#ffffff" opacity="0.12"/>
  <text x="30" y="96" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="800" fill="#fff" text-anchor="middle" transform="rotate(-90 30 96)">AIRE</text>
</g>
<path d="M552 270 q-40 -40 -112 -96" fill="none" stroke="#b794f4" stroke-width="3" stroke-dasharray="4 8" stroke-linecap="round">
  <animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.6s" repeatCount="indefinite"/>
</path>
<!-- pincel -->
<g transform="translate(400 230) rotate(20)">
  <rect x="0" y="0" width="14" height="90" rx="6" fill="#764ba2"/>
  <rect x="-4" y="88" width="22" height="16" rx="3" fill="#9ca3af"/>
  <path d="M-4 104 q11 40 22 0 z" fill="#e5e5e5"/>
</g>
<!-- pasta térmica -->
<g transform="translate(476 64)">
  <rect x="0" y="20" width="26" height="90" rx="6" fill="#e5e5e5"/>
  <rect x="6" y="6" width="14" height="16" rx="2" fill="#9ca3af"/>
  <rect x="9" y="0" width="8" height="8" rx="2" fill="#6b7280"/>
  <rect x="4" y="40" width="18" height="50" rx="3" fill="url(#marca)"/>
  <text x="13" y="76" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="800" fill="#fff" text-anchor="middle" transform="rotate(-90 13 76)">PASTA</text>
</g>
<!-- brillos -->
<path d="M500 246 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z" fill="#b794f4">
  <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/>
</path><path d="M740 286 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z" fill="#b794f4">
  <animate attributeName="opacity" values="0.2;1;0.2" dur="2.3s" repeatCount="indefinite"/>
</path><path d="M700 406 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z" fill="#b794f4">
  <animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/>
</path><path d="M470 406 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z" fill="#b794f4">
  <animate attributeName="opacity" values="0.2;1;0.2" dur="3.3s" repeatCount="indefinite"/>
</path>
<!-- checklist -->
<rect x="530" y="70" width="230" height="200" rx="12" fill="#111118" stroke="#2a2a34"/>
<text x="546" y="94" font-family="Inter, Arial, sans-serif" font-size="11" fill="#9ca3af">SERVICIO COMPLETO</text>
<circle cx="560" cy="112" r="11" fill="#22c55e"/>
  <path d="M554 112 l4 4 l8 -9" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="582" y="117" font-family="Inter, Arial, sans-serif" font-size="14" fill="#e5e5e5">Limpieza interna</text><circle cx="560" cy="152" r="11" fill="#22c55e"/>
  <path d="M554 152 l4 4 l8 -9" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="582" y="157" font-family="Inter, Arial, sans-serif" font-size="14" fill="#e5e5e5">Pasta térmica nueva</text><circle cx="560" cy="192" r="11" fill="#22c55e"/>
  <path d="M554 192 l4 4 l8 -9" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="582" y="197" font-family="Inter, Arial, sans-serif" font-size="14" fill="#e5e5e5">Ventiladores y filtros</text><circle cx="560" cy="232" r="11" fill="#22c55e"/>
  <path d="M554 232 l4 4 l8 -9" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="582" y="237" font-family="Inter, Arial, sans-serif" font-size="14" fill="#e5e5e5">Sistema optimizado</text>
<text x="400" y="472" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">Tu equipo vuelve como nuevo: más silencioso, más frío y más rápido</text>
</svg>